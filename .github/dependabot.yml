# Dependabot — weekly automated dependency PRs.
# Adapted from companion repo sbom-pilot (https://github.com/leagames0221-sys/sbom-pilot, MIT).

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
    # 7-day cooldown — defer Dependabot PRs until the new version has been
    # published for at least 7 days. Mirrors the .npmrc minimum-release-age
    # gate and absorbs essentially all known supply-chain attack lifetimes
    # (e.g. axios 2026-03-31 = 4-5 h; Shai-Hulud TanStack 2026-05-11 = 22 m).
    # GitHub native feature GA 2025-07-01.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      schema-stack:
        patterns:
          - "ajv"
          - "ajv-formats"
          - "zod"
      dev:
        dependency-type: "development"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
