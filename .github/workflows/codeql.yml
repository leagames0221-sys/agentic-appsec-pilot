name: CodeQL

# Static analysis for TypeScript surface. Weekly cron + PR push.
# Adapted from sibling tool sbom-pilot (MIT, internal universal pattern).
# Pre-PUBLIC-flip guard: skip on private repos so the Actions tab stays
# green; workflow auto-activates on PUBLIC visibility flip.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1"  # Weekly, Monday 08:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Check repo visibility
        id: visibility
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "Repository is private; Code Scanning requires PUBLIC visibility (or GHAS)."
            echo "Workflow ready; CodeQL SARIF will publish on PUBLIC flip with no further changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.visibility.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.visibility.outputs.skip != 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
